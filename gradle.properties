# Gradle daemon JVM = JDK 21 (NeoForge 1.21.1 requires JDK 21)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

# Environment
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.248
neo_version_range=[21,)
loader_version_range=[4,)
parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# Mod Properties
mod_id=plug
mod_name=The Plugin Mod
mod_license=All Rights Reserved
mod_version=5.4
mod_group_id=com.kamkeel.plugin
mod_authors=KAMKEEL, Tzi
mod_description=Plugin-Mod ported to Minecraft 1.21.1 NeoForge (Naruto-style weapons, blocks and items).
